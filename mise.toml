# One toolchain file for developers and CI. Install: https://mise.jdx.dev/
# Then: mise install && mise run hooks

[tools]
node = "24"
pnpm = "12.21.0"
hk = "2.12.0"
oxlint = "1.93.0"
oxfmt = "0.78.0"
typos = "1.52.2"
rumdl = "0.3.4"
hadolint = "2.15.1"
betterleaks = "1.10.1"
osv-scanner = "2.7.1"
jactionlint = "2.6.0"
# Used by jactionlint to check shell scripts inside workflow `run:` steps.
shellcheck = "0.11.0"
"github:agent-sh/agnix" = "0.61.0"

[tasks.setup]
description = "Install frontend dependencies"
run = "pnpm --dir src/Calendar.WebApp install --frozen-lockfile"

[tasks.check]
description = "Run every check — the same command CI runs"
depends = ["setup"]
run = "hk check --all"

[tasks.fix]
description = "Run safe autofixes (formatters, lint --fix)"
depends = ["setup"]
run = "hk fix --all"

[tasks.hooks]
description = "Install git hooks (pre-commit, pre-push)"
run = "hk install"
